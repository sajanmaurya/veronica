name: Verify Veronica
on:
  push:
    branches: [feature/security-reliability-food-intelligence]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/veronica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Repair inconsistent pre-existing npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Commit synchronized lockfile on owned feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize package-lock with declared dependencies"
            git push
          fi
      - run: npm ci --legacy-peer-deps
      - run: npx prisma validate
      - run: npm test
      - run: npx next build
